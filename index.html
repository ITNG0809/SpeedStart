<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TurboBoost Player</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <strong>TurboBoost</strong>
  <label class="btn">SB3を開く<input id="file" type="file" accept=".sb3" hidden></label>
  <button id="load-test" type="button">テストゲーム</button>
  <input id="url" type="url" placeholder="SB3のURL(CORS許可が必要)">
  <button id="load-url" type="button">読込</button>
  <button id="selftest" type="button">自己診断</button>
</header>
<details id="diag"><summary>自己診断の結果</summary><pre id="diag-out"></pre></details>
<main id="player-shell">
  <div class="bar">
    <button id="flag" type="button" class="flag">▶ 緑の旗</button>
    <button id="stop" type="button" class="stop">■ 停止</button>
    <select id="size"><option value="fit">画面に合わせる</option><option value="1">1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
    <button id="fs" type="button">⛶ 全画面</button>
    <span class="grow"></span>
    <span class="pressed">押下中: <b id="pressed">—</b></span>
  </div>
  <div id="stage-area"><div id="stage-host"></div></div>
  <div id="status" role="status"></div>
  <div id="layout-tabs"></div>
  <div id="vk"></div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
